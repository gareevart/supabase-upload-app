name: Publish Infrastructure Design Brief

on:
  push:
    branches: [main]
    paths:
      - 'content/briefs/*-infrastructure-design-brief.md'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish newly added briefs to gareev.de
        env:
          GAREEV_BLOG_API_KEY: ${{ secrets.GAREEV_BLOG_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/publish-new-infrastructure-briefs.mjs
