name: Publish Infrastructure Design Brief

on:
  push:
    branches: [main]
    paths:
      - 'content/briefs/**'

permissions:
  contents: read

concurrency:
  group: publish-infrastructure-design-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test cover publishing
        run: node --test scripts/publish-new-infrastructure-briefs.test.mjs
      - name: Publish briefs with generated covers to gareev.de
        env:
          GAREEV_BLOG_API_KEY: ${{ secrets.GAREEV_BLOG_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/publish-new-infrastructure-briefs.mjs
